[project]
name = "studio-bookings"
version = "1.0.0"
description = "Fitness studio class booking system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "requests>=2.32",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
filterwarnings = [
    "error::DeprecationWarning:studio.*",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "unit: pure domain test, no I/O and no doubles",
    "application: use case test wired with in-memory fakes",
    "integration: test crossing the API and a real database",
    "testability: before/after pairs showing the cost of coupled design",
    "properties: property-based tests with hypothesis",
    "exercise: test the class is expected to make pass",
    "lifecycle: setup and teardown mechanics",
    "slow: excluded with -m 'not slow'",
]

[tool.coverage.run]
source = ["src/studio"]
omit = ["*/coupled/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG",
    "PTH", "ERA", "PL", "RUF", "T20", "DTZ", "ANN", "S", "TID", "PIE", "FBT",
]
ignore = [
    "ANN401",
    "PLR0913",
    "PLR0917",
    "S101",
    "FBT001",
    "FBT002",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "PLR2004", "S105", "S106", "DTZ001", "SLF001"]
"src/studio/coupled/*" = ["ALL"]
"src/studio/domain/errors.py" = ["N818"]
"src/studio/api/routers/*" = ["B008"]
"src/studio/api/dependencies.py" = ["B008"]
"scripts/*" = ["T201", "ANN", "S603"]
"src/studio/cli.py" = ["T201"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["studio"]
strict = true
exclude = ["studio/coupled/.*"]
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["studio.coupled.*"]
ignore_errors = true
