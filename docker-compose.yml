services:
  frontend:
    build: ./frontend
    container_name: tienda-frontend
    ports:
      - "5173:5173"
    volumes:
      # El código del host se monta dentro del contenedor: los cambios
      # se reflejan al instante (hot reload de Vite / --watch de Jest)
      - ./frontend:/app
      # Volumen anónimo para que los node_modules del contenedor (Linux)
      # no sean sobrescritos por los del host
      - /app/node_modules
    environment:
      # Evita que Vite intente abrir un navegador dentro del contenedor
      - DOCKER=true
      # Necesario para que el hot reload funcione en Docker/WSL
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
